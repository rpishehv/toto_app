name: Auto-sync match results

on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
    - cron: '0 1  * * *'
    - cron: '0 3  * * *'
    - cron: '0 5  * * *'
    - cron: '0 7  * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync match results
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "https://toto-app-oqdi.vercel.app/api/autosync?secret=${{ secrets.SYNC_SECRET }}")
          body=$(echo "$response" | head -1)
          code=$(echo "$response" | tail -1)
          echo "Status: $code"
          echo "Response: $body"
          if [ "$code" != "200" ]; then
            echo "Sync failed with status $code"
            exit 1
          fi
